<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <!-- Il primo stop del gradiente: la barra di sistema deve continuare la
         pagina, non tagliarla con una tinta di un'altra palette. -->
    <meta name="theme-color" content="#d9dee2" />
    <meta name="description" content="Chat di squadra con agenti AI che lavorano insieme a te" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Hive</title>
    <script>
      /* Il tema si decide PRIMA che la pagina si disegni. Se aspettassimo il
         bundle, chi ha il sistema scuro vedrebbe un lampo bianco a ogni
         avvio. Stessa logica di src/lib/theme.ts, tenuta corta apposta. */
      (function () {
        try {
          var p = localStorage.getItem('hive:theme');
          var dark =
            p === 'dark' ||
            (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#1b2024' : '#d9dee2');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
