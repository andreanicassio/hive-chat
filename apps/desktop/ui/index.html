<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hive</title>
    <style>
      :root {
        --ink: #1f1e19;
        --soft: #57544a;
        --faint: #8b8778;
        --line: #e2ddc8;
        --panel: #ffffff;
        --sunken: #f2eee0;
        --honey: #c8922f;
        --sage: #6b7f56;
        --err: #b6503f;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background: linear-gradient(180deg, #e5e5bd 0%, #d6dbca 50%, #c8d1d7 100%);
        height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      }
      .card {
        width: 100%; max-width: 440px; background: var(--panel);
        border-radius: 18px; padding: 26px;
        box-shadow: 0 1px 2px rgba(60,52,30,.05), 0 18px 44px -12px rgba(60,52,30,.28);
      }
      .logo { font-size: 30px; }
      h1 { font-size: 20px; letter-spacing: -.02em; margin-top: 6px; }
      p.sub { color: var(--soft); font-size: 13.5px; margin-top: 4px; line-height: 1.5; }
      label { display: block; font-size: 12.5px; font-weight: 600; color: var(--soft); margin: 16px 0 6px; }
      input {
        width: 100%; font-size: 14px; padding: 9px 11px; border: 1px solid var(--line);
        border-radius: 10px; background: var(--sunken); color: var(--ink); outline: none;
        -webkit-user-select: text;
      }
      input:focus { border-color: var(--honey); }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        font-size: 14px; font-weight: 600; padding: 11px 14px; border-radius: 11px;
        border: none; cursor: pointer; width: 100%; margin-top: 14px;
      }
      .primary { background: var(--honey); color: #fff; }
      .primary:hover { filter: brightness(1.05); }
      .runner { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
      .row { display: flex; gap: 8px; }
      .row .btn { margin-top: 10px; }
      .ghost { background: var(--sunken); color: var(--ink); }
      .ghost:hover { background: #ece7d6; }
      .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--soft); margin-top: 12px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
      .dot.on { background: var(--sage); box-shadow: 0 0 0 3px rgba(107,127,86,.18); }
      .msg { font-size: 12.5px; color: var(--faint); margin-top: 8px; min-height: 16px; }
      .err { color: var(--err); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">🐝</div>
      <h1>Hive</h1>
      <p class="sub">Apri la chat della squadra e, se vuoi, avvia il tuo runner locale su questo computer.</p>

      <label for="server">Indirizzo del server Hive</label>
      <input id="server" placeholder="https://hive.dvnx.net" />
      <button class="btn primary" id="open">Apri Hive →</button>

      <div class="runner">
        <label for="repo">Runner locale — cartella del repo Hive</label>
        <input id="repo" placeholder="/Users/tuonome/hive" />
        <label for="envfile" style="margin-top:12px">File di configurazione (facoltativo)</label>
        <input id="envfile" placeholder="deploy/runner.env" />
        <div class="row">
          <button class="btn primary" id="start">Avvia runner</button>
          <button class="btn ghost" id="stop">Ferma</button>
        </div>
        <div class="status"><span class="dot" id="dot"></span><span id="statustext">Runner spento</span></div>
        <div class="msg" id="msg"></div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const store = {
        get: (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } },
        set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
      };
      // Ripristina i valori salvati.
      $("server").value = store.get("hive:serverUrl", "https://hive.dvnx.net");
      $("repo").value = store.get("hive:repoPath", "");
      $("envfile").value = store.get("hive:envFile", "deploy/runner.env");

      $("open").onclick = () => {
        const url = $("server").value.trim().replace(/\/+$/, "");
        if (!url) return;
        store.set("hive:serverUrl", url);
        window.location.href = url;
      };

      // Ponte verso Rust (Tauri v2, API globale).
      const invoke = (cmd, args) =>
        window.__TAURI__ && window.__TAURI__.core
          ? window.__TAURI__.core.invoke(cmd, args)
          : Promise.reject(new Error("Disponibile solo nell'app desktop."));

      function setMsg(text, isErr) {
        const m = $("msg");
        m.textContent = text || "";
        m.className = "msg" + (isErr ? " err" : "");
      }

      $("start").onclick = async () => {
        const repoPath = $("repo").value.trim();
        const envFile = $("envfile").value.trim();
        if (!repoPath) return setMsg("Indica la cartella del repo Hive.", true);
        store.set("hive:repoPath", repoPath);
        store.set("hive:envFile", envFile);
        try {
          setMsg(await invoke("start_runner", { repoPath, envFile }));
        } catch (e) {
          setMsg(String(e.message || e), true);
        }
        refresh();
      };

      $("stop").onclick = async () => {
        try {
          setMsg(await invoke("stop_runner"));
        } catch (e) {
          setMsg(String(e.message || e), true);
        }
        refresh();
      };

      async function refresh() {
        let on = false;
        try { on = await invoke("runner_running"); } catch {}
        $("dot").className = "dot" + (on ? " on" : "");
        $("statustext").textContent = on ? "Runner acceso" : "Runner spento";
      }
      refresh();
      setInterval(refresh, 3000);
    </script>
  </body>
</html>
