[package]
name = "hive-desktop"
version = "0.1.3"
description = "Hive desktop app"
authors = ["Hive"]
edition = "2021"

[lib]
name = "hive_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# Notifiche di sistema: nel webview del Mac le push non esistono, e questa
# è l'unica strada per avvisare mentre l'app è aperta.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
