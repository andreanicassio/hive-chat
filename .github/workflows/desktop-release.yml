# Compila l'app desktop di Hive sui runner macOS di GitHub e pubblica il .dmg
# in una Release — così scarichi l'app già pronta, senza installare Rust sul Mac.
#
# Come si lancia:
#   • push di un tag  desktop-v*   (es. `git tag desktop-v0.1.0 && git push --tags`)
#   • oppure a mano dalla tab "Actions" → "Run workflow"
name: Desktop release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write   # per creare la Release e allegare il .dmg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      # Cache dei crate Rust: la seconda build in poi è molto più veloce.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Installa le dipendenze
        run: npm install

      - name: Genera le icone dell'app
        run: npm run -w @hive/desktop icon

      - name: Build + Release del .dmg
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-v0.0.0-dev' }}
          releaseName: 'Hive Desktop ${{ github.ref_name }}'
          releaseBody: 'App desktop di Hive. Installa con: curl -fsSL https://hive.dvnx.net/install-mac | bash'
          releaseDraft: false
          prerelease: false

      # Pubblica l'app sul server Hive per l'installazione "in una riga"
      # (curl non mette in quarantena → niente errore "damaged").
      - name: Pubblica l'app su hive.dvnx.net
        env:
          UPLOAD_TOKEN: ${{ secrets.DESKTOP_UPLOAD_TOKEN }}
        run: |
          set -e
          if [ -z "${UPLOAD_TOKEN:-}" ]; then
            echo "DESKTOP_UPLOAD_TOKEN non impostato: salto la pubblicazione."
            exit 0
          fi
          APP="apps/desktop/src-tauri/target/release/bundle/macos/Hive.app"
          if [ ! -d "$APP" ]; then
            echo "Hive.app non trovato, cerco:"; find apps/desktop/src-tauri/target -maxdepth 6 -name "*.app" -type d
            exit 1
          fi

          # Firma ad-hoc DEL BUNDLE, non solo dell'eseguibile.
          #
          # Senza identità Apple, tauri non firma il .app: resta la firma che
          # il linker mette sul binario, la quale però dichiara di avere un
          # bundle con le sue risorse. macOS trova la contraddizione
          # («code has no resources but signature indicates they must be
          # present») e uccide il processo all'avvio, senza una riga di
          # errore. Ci sono volute due build per capirlo.
          codesign --force --deep --sign - "$APP"

          # E adesso si controlla, PRIMA di pubblicare. Una build che compila
          # non è una build che si apre: questa differenza è costata un
          # pomeriggio, e da qui in poi la macchina la verifica al posto mio.
          codesign -vvv --strict --deep "$APP"
          codesign -dvv "$APP" 2>&1 | head -5
          # ditto preserva firma, symlink e attributi del bundle (a differenza di tar).
          ditto -c -k --keepParent "$APP" hive-mac.zip
          VER="${GITHUB_REF_NAME#desktop-v}"
          echo "Pubblico hive-mac.zip (v$VER, $(du -h hive-mac.zip | cut -f1))…"
          curl -fSL -X PUT "https://hive.dvnx.net/api/desktop/publish/hive-mac.zip?version=$VER" \
            -H "Authorization: Bearer $UPLOAD_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @hive-mac.zip
          echo "" && echo "Fatto: https://hive.dvnx.net/install-mac"
